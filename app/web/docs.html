<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f9fcfe">
<title>__TITLE__ · qq-bot-lite 文档</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem("qqbotlite-theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
      document.documentElement.classList.toggle("dark", theme === "dark");
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0a0f1a" : "#f9fcfe");
    } catch (error) {}
  })();
</script>
<link rel="stylesheet" href="/static/basecoat.css">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar" id="topbar">
  <a class="brand" href="/">qq-bot-lite <span class="ver">v__VERSION__</span></a>
  <span class="tb-sep"></span>
  <span class="tb-scope">文档</span>
  <div class="tb-right">
    <a class="tb-btn tb-doc" href="/">返回设置</a>
    <div class="tb-tools">
      <button class="tb-btn" id="theme" type="button" aria-label="切换主题">◐</button>
    </div>
  </div>
</header>

<main class="docs-page">
  <aside class="docs-side" aria-label="文档目录">
__SIDEBAR__
  </aside>
  <article class="card docs-content md-body">
__CONTENT__
  </article>
</main>

<script>
  (function () {
    var button = document.getElementById("theme");
    if (!button) return;
    button.addEventListener("click", function () {
      var dark = !document.documentElement.classList.contains("dark");
      document.documentElement.classList.toggle("dark", dark);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
      try { localStorage.setItem("qqbotlite-theme", dark ? "dark" : "light"); } catch (error) {}
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#0a0f1a" : "#f9fcfe");
    });
  })();
</script>
</body>
</html>
