title = "运行统计"
description = "运行时长、收发条数、首字延迟和数据库规模，面板里实时刷新。"
version = "0.1.0"
author = "内建"
panel = "/plugins/stats"

[[config]]
key = "window_hours"
label = "统计窗口（小时）"
type = "number"
min = 1
max = 720
step = 1
default = 24
help = "面板上那句“最近 N 小时”就是它"

[[config]]
key = "show_latency"
label = "显示首字延迟"
type = "bool"
default = true
help = "关掉就只显示收发条数"
